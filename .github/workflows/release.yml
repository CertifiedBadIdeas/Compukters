name: CI and mod release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional existing release tag to verify without publishing
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mod-ci-${{ github.sha }}
  cancel-in-progress: false
  queue: max

jobs:
  resolve:
    name: Select verified mod build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_run: ${{ steps.reuse.outputs.source_run }}
      revision: ${{ steps.reuse.outputs.revision }}
      release_tag: ${{ steps.reuse.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Validate tooling and select successful checks of this exact commit
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}
        run: |
          python3 -m unittest discover -s tools/release -v
          python3 tools/release/ci.py resolve

  build:
    name: Verify and collect mod and addon JARs
    needs: resolve
    if: needs.resolve.outputs.source_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Prepare pinned Rust toolchain and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          rust_version=$(python3 -c 'import tomllib; print(tomllib.load(open("host/compukter-vm/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$rust_version" --profile minimal --component clippy --component rustfmt
          rustup default "$rust_version"
          cargo fetch --locked --manifest-path host/compukter-vm/Cargo.toml
          cargo fetch --locked --manifest-path modules/common/compiler-artifact/src/test/rust/executable-conformance/Cargo.toml
      - name: Fetch exact published Runtime bundles
        run: ./gradlew downloadCompukterRuntimeBundles --no-daemon --max-workers=2
      - name: Fully verify exact candidate
        run: ./gradlew verifyLocalFull --no-daemon --parallel --max-workers=2
      - name: Collect universal mod and addon JARs
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(python3 tools/release/ci.py mode)" = release ]; then
            ./gradlew -p addons/dev collectReleaseDistributionJars --no-daemon --max-workers=2
          else
            runtime_directory=$(python3 tools/release/ci.py runtime-directory)
            ./gradlew -p addons/dev collectDistributionJars "-PcompukterRuntimeBundleDir=$runtime_directory" --no-daemon --max-workers=2
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mod-and-addons-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Stage complete verification evidence
        run: |
          python3 tools/release/ci.py stage --directory build/verified
          python3 tools/release/ci.py verify --directory build/verified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mod-verified-${{ needs.resolve.outputs.revision }}
          path: build/verified/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mod-release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/run/gameTestServer/logs/
          if-no-files-found: ignore
          retention-days: 7

  assemble:
    name: Assemble and verify tagged release
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.release_tag != '' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      release_artifact: verified-mod-release-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          submodules: recursive
      - name: Download complete same-commit verification evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mod-verified-${{ needs.resolve.outputs.revision }}
          run-id: ${{ needs.resolve.outputs.source_run || github.run_id }}
          github-token: ${{ github.token }}
          path: build/verified
      - name: Verify reused source, archives and exact release tag
        id: evidence
        run: |
          python3 tools/release/ci.py verify --directory build/verified
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/release')
          import ci
          ci.validate_tag(Path.cwd(), os.environ['RELEASE_TAG'])
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.evidence.outputs.stable != 'true'
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Prepare pinned Rust toolchain and locked dependencies
        if: steps.evidence.outputs.stable != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rust_version=$(python3 -c 'import tomllib; print(tomllib.load(open("host/compukter-vm/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$rust_version" --profile minimal --component clippy --component rustfmt
          rustup default "$rust_version"
          cargo fetch --locked --manifest-path host/compukter-vm/Cargo.toml
          cargo fetch --locked --manifest-path modules/common/compiler-artifact/src/test/rust/executable-conformance/Cargo.toml
      - name: Fetch exact published Runtime bundles
        if: steps.evidence.outputs.stable != 'true'
        run: ./gradlew downloadCompukterRuntimeBundles --no-daemon --max-workers=2
      - name: Assemble stable JARs with clean tagged universal release gates
        if: steps.evidence.outputs.stable != 'true'
        run: ./gradlew -p addons/dev collectReleaseDistributionJars --no-daemon --max-workers=2
      - name: Stage stable release inventory
        if: steps.evidence.outputs.stable != 'true'
        run: python3 tools/release/release.py prepare --tag "$RELEASE_TAG" --output build/release
      - name: Reuse already verified stable release inventory
        if: steps.evidence.outputs.stable == 'true'
        run: cp -a build/verified build/release
      - name: Verify final release inventory
        run: python3 tools/release/release.py verify --directory build/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-mod-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mod-release-assembly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/run/gameTestServer/logs/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish GitHub and Modrinth
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mod-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.assemble.outputs.release_artifact }}
          path: build/release
      - name: Verify staged release and credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          python3 tools/release/release.py verify --directory build/release
          python3 - <<'PY'
          import os
          if not os.environ.get('MODRINTH_TOKEN'):
              raise SystemExit('Configure MODRINTH_TOKEN in the mod-release environment or repository secrets')
          PY
      - name: Publish immutable GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/release.py github --directory build/release
      - name: Publish matching Modrinth versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 tools/release/release.py modrinth --directory build/release
