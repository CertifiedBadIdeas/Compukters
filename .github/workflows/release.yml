name: Mod release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: mod-release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build tagged mod and addon JARs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      release_artifact: verified-mod-release-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Validate exact release tag
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/release')
          import ci
          ci.validate_tag(Path.cwd(), os.environ['RELEASE_TAG'])
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Prepare pinned Rust toolchain and locked build dependencies
        shell: bash
        run: |
          set -euo pipefail
          rust_version=$(python3 -c 'import tomllib; print(tomllib.load(open("host/compukter-vm/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$rust_version" --profile minimal
          rustup default "$rust_version"
          cargo fetch --locked --manifest-path host/compukter-vm/Cargo.toml
      - name: Publish local addon SDK and fetch exact Runtime bundles
        run: ./gradlew :addon-gradle-plugin:publishAddonSdkToMavenLocal downloadCompukterRuntimeBundles --no-daemon --parallel --max-workers=2
      - name: Build stable JARs without test tasks
        run: ./gradlew -p addons/dev collectReleaseDistributionJars --no-daemon --parallel --max-workers=2 -x :Compukters:native-runtime-ffm:packagedNativeIntegrationTest -x :Compukters:native-runtime-jni:packagedNativeIntegrationTest
      - name: Stage and verify release inventory
        run: |
          python3 tools/release/release.py prepare --tag "$RELEASE_TAG" --output build/release
          python3 tools/release/release.py verify --directory build/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-mod-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub and Modrinth
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mod-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.release_artifact }}
          path: build/release
      - name: Verify staged release and credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          python3 tools/release/release.py verify --directory build/release
          python3 - <<'PY'
          import os
          if not os.environ.get('MODRINTH_TOKEN'):
              raise SystemExit('Configure MODRINTH_TOKEN in the mod-release environment or repository secrets')
          PY
      - name: Publish immutable GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/release.py github --directory build/release
      - name: Publish matching Modrinth versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 tools/release/release.py modrinth --directory build/release
