name: Deploy documentation to Pages

on:
  push:
    branches: ["dev"]
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "modules/common/guest-platform/src/platform/**"
      - "modules/common/platform-k2/build.gradle.kts"
      - "modules/common/platform-k2/src/main/kotlin/ru/lazyhat/compukters/platform/k2/build/GuestApiDocumentationMain.kt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Generate Guest Kotlin source browser
        run: python3 docs/_tools/build_guest_source.py
      - name: Export Guest API declarations
        run: ./gradlew :platform-k2:exportGuestApiDocumentation --no-daemon
      - name: Generate Guest Kotlin API reference
        run: python3 docs/_tools/build_guest_api.py
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
