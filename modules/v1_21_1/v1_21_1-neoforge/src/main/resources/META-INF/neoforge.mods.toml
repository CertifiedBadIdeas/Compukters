modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${homepage_url}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="compuktercraft.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="${neoforge_mod_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Optional Create integration. The mod must load with or without Create installed; activation
# happens through CreateCompatBootstrap.initializeIfPresent guarded by ModList.isLoaded.
[[dependencies.${mod_id}]]
modId="create"
type="optional"
versionRange="[6.0,)"
ordering="AFTER"
side="BOTH"